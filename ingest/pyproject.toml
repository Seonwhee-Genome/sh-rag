[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sh-rag-ingest"
version = "0.3.0"
description = "Document ingestion pipeline for the sh-rag local RAG stack"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "python-multipart>=0.0.9",
    "httpx>=0.27,<1",
    "qdrant-client>=1.12,<2",
    "pypdf>=4.2,<7",
    "python-docx>=1.1,<2",
    "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sh-rag-ingest = "ingest.cli:main"

[tool.setuptools.packages.find]
include = ["ingest*"]

[tool.setuptools.package-data]
ingest = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
